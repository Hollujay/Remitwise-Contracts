[package]
name = "remitwise-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    "emergency_killswitch",
    "family_wallet",
    "data_migration",
    "reporting",
    "orchestrator",
    "cli",
    "scenarios",
    "testutils",
    "integration_tests",
    "remitwise-common",
]
exclude = [
    "bill_payments",
    "insurance",
    "remittance_split",
    "savings_goals",
]
default-members = [
    "family_wallet",
    "data_migration",
    "reporting",
    "orchestrator",
]
resolver = "2"

[workspace.dependencies]
ed25519-dalek = "=2.1.1"

[dependencies]
soroban-sdk = "=21.7.7"
ed25519-dalek = "=2.2.0"
family_wallet = { path = "./family_wallet" }
reporting = { path = "./reporting" }
orchestrator = { path = "./orchestrator" }
remitwise-common = { path = "./remitwise-common" }

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
ed25519-dalek = { path = "vendor/ed25519-dalek-2.2.0" }
